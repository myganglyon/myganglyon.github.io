<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Ganglyon</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link type="text/css" href="style.css" rel="stylesheet" />
  </head>
  <body>
    <main class="container py-4">
      <header class="app-header mb-4">
        <a class="back-btn text-decoration-none" href="index.html">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="page-title">Questions</h1>
      </header>
      <hr class="section-divider" />
      <!-- Page Header -->
      <header>
        <h1 class="page-title" id="subjectTitle">Questions</h1>
        <p class="question-count" id="questionCount">0 Questions Found</p>
      </header>
      <!-- Search Bar -->
      <div class="position-relative mb-2">
        <input
          id="searchInput"
          class="form-control search-input py-3 pe-5"
          placeholder="Search here..."
          type="text"
        />
        <i
          class="fa-solid fa-magnifying-glass position-absolute top-50 end-0 translate-middle-y me-3 text-muted fs-6"
        ></i>
      </div>
      <!-- Filter Button -->
      <button
        class="btn btn-primary filter-btn py-3 w-100"
        data-bs-target="#filterModal"
        data-bs-toggle="modal"
      >
        <i class="fa-solid fa-sliders"></i>
        Filter
      </button>
      <hr class="section-divider" />
      <!-- Question Card -->

      <section id="questionsContainer"></section>
    </main>
    <!-- Filter Modal -->
    <div class="modal fade" id="filterModal" tabindex="-1">
      <div class="modal-dialog custom-sheet">
        <div class="modal-content border-0">
          <div class="modal-header border-0 pb-2">
            <div>
              <h5 class="modal-title fw-bold">Filters</h5>
            </div>
            <button
              aria-label="Close filters"
              class="btn-close shadow-none"
              data-bs-dismiss="modal"
              type="button"
            ></button>
          </div>
          <div class="modal-body pt-2">
            <div class="mb-3">
              <label class="form-label filter-label">Year</label>
              <select
                class="form-select filter-select"
                id="yearFilter"
              ></select>
            </div>
            <div class="mb-3">
              <label class="form-label filter-label">Month</label>
              <select
                class="form-select filter-select"
                id="monthFilter"
              ></select>
            </div>
            <div class="mb-3">
              <label class="form-label filter-label">University</label>
              <select
                class="form-select filter-select"
                id="universityFilter"
              ></select>
            </div>
            <div class="mb-4">
              <label class="form-label filter-label">Topic</label>
              <select
                class="form-select filter-select"
                id="topicFilter"
              ></select>
            </div>
            <button
              class="btn btn-primary w-100 py-3 fw-bold mb-2"
              id="applyFiltersBtn"
            >
              Apply Filters
            </button>

            <button
              class="btn btn-light w-100 py-3 fw-bold"
              id="resetFiltersBtn"
            >
              Reset
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <button
      aria-label="Toggle dark mode"
      class="theme-toggle-btn"
      id="themeToggle"
      type="button"
    >
      <span class="theme-toggle-icon"></span>
    </button>
    <script>
      const themeToggle = document.getElementById("themeToggle");
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme === "dark") {
        document.body.classList.add("dark-mode");
      }

      if (themeToggle) {
        themeToggle.addEventListener("click", () => {
          document.body.classList.toggle("dark-mode");

          const isDarkMode = document.body.classList.contains("dark-mode");
          localStorage.setItem("theme", isDarkMode ? "dark" : "light");
        });
      }
    </script>
    <script>
      let allQuestions = [];
      let currentFilters = {
        year: "",
        month: "",
        university: "",
        topic: "",
        search: "",
      };

      const subjectTitle = document.getElementById("subjectTitle");
      const questionCount = document.getElementById("questionCount");
      const questionsContainer = document.getElementById("questionsContainer");

      const searchInput = document.getElementById("searchInput");
      const yearFilter = document.getElementById("yearFilter");
      const monthFilter = document.getElementById("monthFilter");
      const universityFilter = document.getElementById("universityFilter");
      const topicFilter = document.getElementById("topicFilter");

      const applyFiltersBtn = document.getElementById("applyFiltersBtn");
      const resetFiltersBtn = document.getElementById("resetFiltersBtn");

      const params = new URLSearchParams(window.location.search);
      const subject = params.get("subject") || "anatomy";

      const subjectName = subject.charAt(0).toUpperCase() + subject.slice(1);
      subjectTitle.textContent = subjectName;

      fetch(`${subject}.json`)
        .then((response) => response.json())
        .then((data) => {
          allQuestions = data;
          updatePage();
        });

      function getFilteredQuestions() {
        return allQuestions.filter((item) => {
          const searchTerm = currentFilters.search.toLowerCase();

          const matchesSearch =
            !searchTerm ||
            item.question.toLowerCase().includes(searchTerm) ||
            item.topics.some((topic) =>
              topic.toLowerCase().includes(searchTerm),
            );

          const matchesTopic =
            !currentFilters.topic || item.topics.includes(currentFilters.topic);

          const matchesAppearance = item.appearances.some((app) => {
            return (
              (!currentFilters.university ||
                app.university === currentFilters.university) &&
              (!currentFilters.year ||
                String(app.year) === currentFilters.year) &&
              (!currentFilters.month || app.month === currentFilters.month)
            );
          });

          return matchesSearch && matchesTopic && matchesAppearance;
        });
      }

      function updatePage() {
        const filteredQuestions = getFilteredQuestions();

        questionCount.textContent = `${filteredQuestions.length} Questions Found`;
        renderQuestions(filteredQuestions);
        renderDynamicFilters(filteredQuestions);
      }

      function renderQuestions(questions) {
        questionsContainer.innerHTML = "";

        if (questions.length === 0) {
          questionsContainer.innerHTML = `
    <div class="card question-card rounded-4 mb-3">
      <div class="card-body p-4 text-center">
        <h3 class="question-title mb-2">No questions found</h3>
        <p class="text-muted mb-0">
          No questions match your selected filters or search term.
        </p>
      </div>
    </div>
  `;
          return;
        }

        questions.forEach((item) => {
          const examHistory = groupAppearances(item.appearances);
          const topicsHtml = item.topics
            .map((topic) => `<span class="badge text-bg-light">${topic}</span>`)
            .join("");

          questionsContainer.innerHTML += `
        <article class="card question-card rounded-4 mb-3">
          <div class="card-body p-3">
            <div class="exam-history">
              ${examHistory}
            </div>

            <h3 class="card-title question-title">
              ${item.question}
            </h3>

            <div class="d-flex gap-2 flex-wrap">
              ${topicsHtml}
            </div>
          </div>
        </article>
      `;
        });
      }

      function groupAppearances(appearances) {
        const grouped = {};

        appearances.forEach((app) => {
          if (!grouped[app.university]) {
            grouped[app.university] = [];
          }

          grouped[app.university].push(
            `${app.month} ${String(app.year).slice(-2)}`,
          );
        });

        return Object.entries(grouped)
          .map(([university, dates], index, array) => {
            const separator =
              index < array.length - 1
                ? `<span class="exam-separator">/</span>`
                : "";

            return `
          <span class="exam-group">
            <span class="uni">${university}</span>
            <span class="dates">${dates.join(", ")}</span>
          </span>
          ${separator}
        `;
          })
          .join("");
      }

      function renderDynamicFilters() {
        populateSelect(
          yearFilter,
          "All years",
          getAvailableValues("year"),
          currentFilters.year,
        );

        populateSelect(
          monthFilter,
          "All months",
          getAvailableValues("month"),
          currentFilters.month,
        );

        populateSelect(
          universityFilter,
          "All universities",
          getAvailableValues("university"),
          currentFilters.university,
        );

        populateSelect(
          topicFilter,
          "All topics",
          getAvailableTopics(),
          currentFilters.topic,
        );
      }

      function populateSelect(
        selectElement,
        defaultText,
        values,
        selectedValue,
      ) {
        const monthFullNames = {
          Jan: "January",
          Feb: "February",
          Mar: "March",
          Apr: "April",
          May: "May",
          Jun: "June",
          Jul: "July",
          Aug: "August",
          Sep: "September",
          Oct: "October",
          Nov: "November",
          Dec: "December",
        };

        selectElement.innerHTML = `<option value="">${defaultText}</option>`;

        values.forEach((value) => {
          const option = document.createElement("option");

          option.value = value;
          option.textContent = monthFullNames[value] || value;

          if (value === selectedValue) {
            option.selected = true;
          }

          selectElement.appendChild(option);
        });
      }

      function getAvailableYears(questions) {
        return [
          ...new Set(
            questions.flatMap((item) =>
              item.appearances.map((app) => String(app.year)),
            ),
          ),
        ].sort((a, b) => b - a);
      }

      function getAvailableMonths(questions) {
        return [
          ...new Set(
            questions.flatMap((item) =>
              item.appearances.map((app) => app.month),
            ),
          ),
        ];
      }

      function getAvailableUniversities(questions) {
        return [
          ...new Set(
            questions.flatMap((item) =>
              item.appearances.map((app) => app.university),
            ),
          ),
        ].sort();
      }

      function getAvailableTopics() {
        const topics = new Set();

        allQuestions.forEach((item) => {
          const matchesAppearance = item.appearances.some((app) => {
            return (
              (!currentFilters.university ||
                app.university === currentFilters.university) &&
              (!currentFilters.year ||
                String(app.year) === currentFilters.year) &&
              (!currentFilters.month || app.month === currentFilters.month)
            );
          });

          if (matchesAppearance) {
            item.topics.forEach((topic) => topics.add(topic));
          }
        });

        return [...topics].sort();
      }

      function syncFiltersFromInputs() {
        currentFilters.year = yearFilter.value;
        currentFilters.month = monthFilter.value;
        currentFilters.university = universityFilter.value;
        currentFilters.topic = topicFilter.value;
      }

      searchInput.addEventListener("input", () => {
        currentFilters.search = searchInput.value.trim();
        updatePage();
      });

      [yearFilter, monthFilter, universityFilter, topicFilter].forEach(
        (select) => {
          select.addEventListener("change", () => {
            syncFiltersFromInputs();
            updatePage();
          });
        },
      );

      applyFiltersBtn.addEventListener("click", () => {
        syncFiltersFromInputs();
        updatePage();

        const modalElement = document.getElementById("filterModal");
        const modal = bootstrap.Modal.getInstance(modalElement);

        if (modal) {
          modal.hide();
        }
      });

      resetFiltersBtn.addEventListener("click", () => {
        currentFilters = {
          year: "",
          month: "",
          university: "",
          topic: "",
          search: "",
        };

        searchInput.value = "";
        updatePage();
      });
      function getAvailableValues(field) {
        const values = new Set();

        allQuestions.forEach((item) => {
          const searchTerm = currentFilters.search.toLowerCase();

          const matchesSearch =
            !searchTerm ||
            item.question.toLowerCase().includes(searchTerm) ||
            item.topics.some((topic) =>
              topic.toLowerCase().includes(searchTerm),
            );

          const matchesTopic =
            !currentFilters.topic || item.topics.includes(currentFilters.topic);

          if (!matchesSearch || !matchesTopic) return;

          item.appearances.forEach((app) => {
            const matchesUniversity =
              field === "university" ||
              !currentFilters.university ||
              app.university === currentFilters.university;

            const matchesYear =
              field === "year" ||
              !currentFilters.year ||
              String(app.year) === currentFilters.year;

            const matchesMonth =
              field === "month" ||
              !currentFilters.month ||
              app.month === currentFilters.month;

            if (matchesUniversity && matchesYear && matchesMonth) {
              values.add(String(app[field]));
            }
          });
        });

        if (field === "month") {
          const monthOrder = [
            "Jan",
            "Feb",
            "Mar",
            "Apr",
            "May",
            "Jun",
            "Jul",
            "Aug",
            "Sep",
            "Oct",
            "Nov",
            "Dec",
          ];

          return [...values].sort(
            (a, b) => monthOrder.indexOf(a) - monthOrder.indexOf(b),
          );
        }

        return [...values].sort((a, b) => {
          if (!isNaN(a) && !isNaN(b)) return b - a;
          return a.localeCompare(b);
        });
      }
    </script>
  </body>
</html>
